[project]
name = "data-normalizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=18.0.0",
    "h5py>=3.16.0",
    "mediapipe>=1.0.0",
    "open3d>=0.19.0",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyglet<2",
    "pytest>=9.1.1",
    "torch>=2.5.1",
    "tqdm>=4.68.3",
    "transformers>=5.15.0",
    "yourdfpy>=0.0.60",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]

[tool.uv]
environments = ["sys_platform == 'linux'"]
